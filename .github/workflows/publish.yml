name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Install Weaver — required for spiny-orb schema validation tests in the test suite
      - name: Install Weaver CLI
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/open-telemetry/weaver/releases/download/v0.22.1/weaver-installer.sh | sh
          weaver --version

      # Install Ruff and Black — required for the Python provider's formatter tests,
      # which run as part of `npm publish`'s prepublishOnly `npm test` step.
      - name: Install Ruff and Black (Python formatters)
        run: |
          pipx install ruff==0.15.2
          pipx install black==25.1.0

      - run: npm install -g npm@latest   # Ensure npm >= 11.5.1
      - run: npm ci
      - run: npm publish --provenance    # --provenance must be explicit; do not rely on automatic generation
